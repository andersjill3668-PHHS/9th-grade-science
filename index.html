<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layers of the Earth Practice Quiz</title>
<style>
  *{box-sizing:border-box}
  body{font-family:Arial,Helvetica,sans-serif;background:#f2f5f7;color:#17212b;margin:0;padding:24px}
  .wrap{max-width:900px;margin:auto}
  header,.card,.results{background:#fff;border-radius:14px;padding:24px;margin-bottom:18px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  h1{margin:0 0 8px;font-size:30px} h2{font-size:20px}
  .sub{color:#52606d;margin:0}
  .question{font-weight:700;font-size:18px;margin-bottom:14px}
  label{display:block;border:1px solid #d8dee4;border-radius:9px;padding:11px 12px;margin:8px 0;cursor:pointer}
  label:hover{background:#f6f8fa}
  input{margin-right:9px}
  button{border:0;border-radius:9px;padding:13px 20px;font-size:16px;font-weight:700;cursor:pointer;margin-right:10px}
  #submitBtn{background:#1f6f43;color:white}
  #retryBtn{background:#34495e;color:white}
  .actions{text-align:center;margin:26px 0}
  .results{display:none;text-align:center}
  .score{font-size:34px;font-weight:800;margin:10px}
  .feedback{display:none;margin-top:12px;padding:12px;border-radius:8px;line-height:1.45}
  .correct{border:2px solid #2e7d32;background:#edf8ef}
  .incorrect{border:2px solid #b3261e;background:#fff0ef}
  .correct .feedback{background:#dff2e3}
  .incorrect .feedback{background:#ffe0de}
  .answer{font-weight:700}
  .unanswered{outline:3px solid #e0a800}
  footer{text-align:center;color:#667085;font-size:13px;padding:10px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Layers of the Earth — Practice Quiz</h1>
  <p class="sub">20 questions based on the class worksheet: composition, thickness, and state of matter.</p>
</header>
<div id="quiz"></div>
<div class="actions">
  <button id="submitBtn" onclick="submitQuiz()">Submit Quiz</button>
  <button id="retryBtn" onclick="retryQuiz()" style="display:none">Retry Quiz</button>
</div>
<div id="results" class="results"></div>
<footer>Practice Quiz • Layers of the Earth</footer>
</div>

<script>
const questions = [
["Which Earth layer is rocky, rigid, and about 100 km thick?",["Lithosphere","Asthenosphere","Outer Core","Inner Core"],0,"The lithosphere is rocky and rigid and is about 100 km thick on the worksheet."],
["Which state of matter or behavior belongs with the asthenosphere?",["Rigid","Plastic","Liquid","Gas"],1,"The asthenosphere is plastic, meaning it can deform somewhat like putty or clay."],
["On the worksheet, the word “plastic” describes which property of the asthenosphere?",["Composition","Thickness","State of matter/behavior","Depth"],2,"Plastic describes how the material behaves, so it belongs under state of matter/behavior."],
["Approximately how thick is the asthenosphere?",["100 km","200 km","1,220 km","2,440 km"],1,"The worksheet lists the asthenosphere at approximately 200 km thick."],
["Which layer is approximately 2,440 km thick?",["Lithosphere","Asthenosphere","Mesosphere","Inner Core"],2,"The mesosphere is listed as approximately 2,440 km thick."],
["What state of matter or behavior is associated with the mesosphere?",["Rigid","Plastic","Liquid","Gas"],0,"The worksheet identifies the mesosphere as rigid."],
["Which layer is composed mainly of iron and nickel and is liquid?",["Lithosphere","Mesosphere","Outer Core","Inner Core"],2,"The outer core is mainly iron and nickel and is liquid."],
["Which layer is composed mainly of iron and nickel and is rigid/solid?",["Inner Core","Outer Core","Asthenosphere","Oceanic Crust"],0,"The inner core is mainly iron and nickel and is rigid/solid."],
["Approximately how thick is the outer core on the worksheet?",["100 km","200 km","1,260 km","2,440 km"],2,"The worksheet lists the outer core at approximately 1,260 km thick."],
["Approximately how thick is the inner core on the worksheet?",["100 km","200 km","1,220 km","2,440 km"],2,"The worksheet lists the inner core at approximately 1,220 km thick."],
["Which pair has the same basic composition but different states of matter?",["Outer Core and Inner Core","Asthenosphere and Outer Core","Lithosphere and Inner Core","Mesosphere and Outer Core"],0,"Both core layers are mainly iron and nickel. The outer core is liquid while the inner core is rigid/solid."],
["Which statement correctly compares the outer core and inner core?",["Both are liquid.","Both are rocky and plastic.","Both contain mainly iron and nickel, but the outer core is liquid and the inner core is rigid/solid.","The outer core is rocky while the inner core is liquid."],2,"The two core layers have similar composition but different physical states."],
["Which layer is located directly below the lithosphere?",["Asthenosphere","Outer Core","Inner Core","Mesosphere"],0,"The asthenosphere lies directly below the lithosphere."],
["Which sequence correctly orders the physical layers from near the surface toward the center?",["Lithosphere → Asthenosphere → Mesosphere → Outer Core → Inner Core","Asthenosphere → Lithosphere → Mesosphere → Inner Core → Outer Core","Lithosphere → Mesosphere → Asthenosphere → Outer Core → Inner Core","Inner Core → Outer Core → Mesosphere → Asthenosphere → Lithosphere"],0,"The correct inward order is lithosphere, asthenosphere, mesosphere, outer core, inner core."],
["The worksheet describes oceanic crust as which general type of material?",["Rocky","Iron and nickel","Liquid metal","Plastic metal"],0,"Oceanic crust is rocky material."],
["The worksheet describes continental crust as which general type of material?",["Liquid iron","Rocky","Plastic nickel","Liquid rock"],1,"Continental crust is rocky material."],
["Which property best describes both oceanic crust and continental crust?",["Liquid","Plastic","Rigid","Iron and nickel"],2,"Both types of crust are rigid rocky material."],
["A layer is about 200 km thick and plastic. Which layer is it?",["Lithosphere","Asthenosphere","Mesosphere","Outer Core"],1,"About 200 km thick plus plastic behavior identifies the asthenosphere."],
["A layer is about 2,440 km thick and rigid. Which layer is it?",["Asthenosphere","Lithosphere","Mesosphere","Outer Core"],2,"About 2,440 km thick plus rigid behavior identifies the mesosphere."],
["A student writes “iron and nickel” in the state-of-matter column for the outer core. What is the best correction?",["Move iron and nickel to composition; write liquid for state of matter.","Keep iron and nickel there; write rocky for composition.","Replace iron and nickel with rigid; write plastic for composition.","Move iron and nickel to thickness; write 200 km for state of matter."],0,"Iron and nickel describe composition—what the layer is made of. Liquid describes the outer core's state of matter."]
];

function render(){
 const q=document.getElementById("quiz"); q.innerHTML="";
 questions.forEach((x,i)=>{
   const d=document.createElement("div"); d.className="card"; d.id="q"+i;
   d.innerHTML=`<div class="question">${i+1}. ${x[0]}</div>`+
   x[1].map((a,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${a}</label>`).join("")+
   `<div class="feedback" id="f${i}"></div>`;
   q.appendChild(d);
 });
}
function submitQuiz(){
 let score=0, missing=0;
 questions.forEach((x,i)=>{
   const card=document.getElementById("q"+i), chosen=document.querySelector(`input[name="q${i}"]:checked`);
   card.classList.remove("correct","incorrect","unanswered");
   const f=document.getElementById("f"+i);
   if(!chosen){missing++;card.classList.add("unanswered");f.style.display="none";return;}
   const val=Number(chosen.value);
   if(val===x[2]){score++;card.classList.add("correct");f.innerHTML=`<span class="answer">Correct.</span> ${x[3]}`;}
   else{card.classList.add("incorrect");f.innerHTML=`<span class="answer">Correct answer: ${x[1][x[2]]}</span><br>${x[3]}`;}
   f.style.display="block";
   card.querySelectorAll("input").forEach(el=>el.disabled=true);
 });
 if(missing){alert(`Please answer all questions before submitting. ${missing} question${missing>1?"s are":" is"} unanswered.`);return;}
 const pct=Math.round(score/questions.length*100);
 let msg=pct>=90?"Excellent work!":pct>=80?"Good job — review the missed questions.":pct>=70?"Getting there — review the explanations and retry.":"Use the feedback to review the layers, then retry the quiz.";
 const r=document.getElementById("results");
 r.innerHTML=`<h2>Quiz Results</h2><div class="score">${score} / ${questions.length} — ${pct}%</div><p>${msg}</p>`;
 r.style.display="block";
 document.getElementById("submitBtn").style.display="none";
 document.getElementById("retryBtn").style.display="inline-block";
 r.scrollIntoView({behavior:"smooth"});
}
function retryQuiz(){
 document.querySelectorAll("input").forEach(el=>{el.checked=false;el.disabled=false});
 document.querySelectorAll(".card").forEach(el=>el.classList.remove("correct","incorrect","unanswered"));
 document.querySelectorAll(".feedback").forEach(el=>el.style.display="none");
 document.getElementById("results").style.display="none";
 document.getElementById("submitBtn").style.display="inline-block";
 document.getElementById("retryBtn").style.display="none";
 window.scrollTo({top:0,behavior:"smooth"});
}
render();
</script>
</body>
</html>
